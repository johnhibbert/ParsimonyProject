	<h2>Resume Builder</h2>
	
	<div id='explanation'>This tool will generate some <a href="https://en.wikipedia.org/wiki/TeX">TeX typesetting</a>  that can be used to create a fancy resume based on the template used here. <a href="https://github.com/johnhibbert/Resume">https://github.com/johnhibbert/Resume</a> </div>

	<input type="button" onclick='getOutput()' value="Get Output"><br><br>

	<label for='Name'>Name:</label>  <input id='Name'></input><br><br>

    <script>
		
		
		
		
		let positions = [1, 2, 3, 4];
		
		function getOutput()
		{
			positions.forEach(calculateSalary);
			
		}
		
        function calculateSalary(sectionNum) {
			
			//This is a relatively simple way to keep the salary calculation code the same for each component.
			//Each piece is name#
			let id = sectionNum;
			console.log("id: " + sectionNum);

			let salary = document.getElementById('salary'+id).value;
			
			//The proportional factors:
			//These are ones that affect your compensation as a proportion of the whole.
			//These typically relate to your time or your salary directly:
			///PTO, 401k Match %, commute, and hourly expectations.
			
			//Expected hours: If your job will require you to work more or fewer hours than 40, that will reduce or increase your de facto pay.
			let expectedWorkingHours = document.getElementById('expectedWorkingHours'+id).value;
			let hoursFactor = (40 / expectedWorkingHours) - 1;
					
			//PTO factor: PTO are days you get paid without working so it's essentially addtional pay.  Simple.
			let ptoDays = document.getElementById('ptoDays'+id).value;
			let ptoFactor = (365 / (365 - ptoDays)) - 1;
			
			//Match %: This is free money so consider it to be added to your pay.  Simple.
			let matchPercent = document.getElementById('401kMatch'+id).value;
			let matchFactor = (matchPercent / 100);
			
			//Commuting costs: Time you spend driving is time lost, so it's effectively a drain on your pay.
			//The simple part is that the time it takes to commute time and the number of days expected in office.
			let oneWayCommutingTime = document.getElementById('oneWayCommutingTime'+id).value;
			let weeklyDaysInOffice = document.getElementById('weeklyDaysInOffice'+id).value;
			
			let minutesSpentCommutingWeekly =  2 * oneWayCommutingTime * weeklyDaysInOffice;
			console.log(`minutesSpentCommutingWeekly ${id}: ` + minutesSpentCommutingWeekly);
			
			//The complicated part is to consider that any PTO will probably mean fewer days commuting.
			//To reflect that, we multiply the commute by the simple proportion of time working actually working.
			
			let approximateWeeksCommutingMinusVacation = 52 - (ptoDays / 5);
			console.log(`approximateWeeksCommutingMinusVacation ${id}: ` + approximateWeeksCommutingMinusVacation);
			
			let estimateOfMinutesSpentCommutingWeekly =  (approximateWeeksCommutingMinusVacation / 52) * minutesSpentCommutingWeekly;
			console.log(`estimateOfMinutesSpentCommutingWeekly ${id}: ` + estimateOfMinutesSpentCommutingWeekly);
			
			let commutingFactor = (2400 / (2400 + ( estimateOfMinutesSpentCommutingWeekly))) - 1;
			console.log(`Commuting Factor ${id}: ` + commutingFactor);
			
			
			//Now we sum of all these proportional factors. to produce our multiplicand.
			let netFactor = 1 + (ptoFactor + matchFactor + hoursFactor + commutingFactor);
	
			
			//The flat factors:
			//Some factors directly affect the bottom line without any proportion to time or pay.
			//This could include parking/commuting passes that are not reimbursed, or the cost of gas if driving.
			
			let sumOfFlatCostsOrBenefits = Number(document.getElementById('sumOfFlatCostsOrBenefits'+id).value);
			
			let yearlyFlatCosts = sumOfFlatCostsOrBenefits * 12;
			console.log('Yearly Flat Costs/Benefits: ' + yearlyFlatCosts);
			
			let includingCostOfGas = document.getElementById('includeGasMileage'+id).checked;
			console.log('including Cost of Gas: ' + includingCostOfGas);
			
			if(includingCostOfGas === true)
			{
				let costOfGas = Number(document.getElementById('priceOfGas'+id).value);
				console.log('Cost of Gas: ' + costOfGas);

				let milesDriven = Number(document.getElementById('commuteInMiles'+id).value);
				console.log('Miles Driven: ' + milesDriven);
				
				let milesPerGallon = Number(document.getElementById('gasMileage'+id).value);
				console.log('MPG: ' + milesPerGallon);
				
				let gallonsPerTrip = milesDriven / milesPerGallon;
				console.log('gallonsPerTrip: ' + gallonsPerTrip);
				
				let totalGasPerWeek = 2 * weeklyDaysInOffice * gallonsPerTrip * costOfGas;
				console.log('totalGasPerWeek: ' + totalGasPerWeek);
				
				yearlyFlatCosts = yearlyFlatCosts - (totalGasPerWeek * 52);
				console.log('new yearly flat costs: ' + yearlyFlatCosts);
			}

			
			//Now we have the effective salary, sounded to dollar.
			let effectiveSalary = ((salary * netFactor) + (yearlyFlatCosts)).toFixed(0);
			
			let newElement = document.createElement('div');
			newElement.innerHTML = effectiveSalary;
			newElement.id = 'result'+id;
			document.getElementById('result'+id).replaceWith(newElement);
			
		}
			
    </script>
