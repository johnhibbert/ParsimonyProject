		}

		<!-- SECTION METHODS -->
		function writeJobSeekerName(name)
		{
			return tex_WriteFullLineAtSize(name, 'Huge');
			//return tex_Line(`\\textbf{\\Huge \\scshape ` + name +`} \\\\ \\vspace{1pt}`);
		}
		
		function writePhoneNumber(number)
		{
			return `` + number;
		}

		function writeEmailLink(address)
		{
			let link = "mailto:" + address;
			let text = address;
			
			return writeHyperlink(link, text)
		}

		function writeSocialLink(address)
		{
			let link = address;
			let text = address.toLowerCase().replace("https://","").replace("www.","");

			return writeHyperlink(link, text)
		}

		function writeHyperlink(link, text)
		{
			let value = "";
			value += tex_SetMisc('href');
			value += `{` + link + `}{`;
			value += tex_SetMisc('underline');
			value += `{` + text + `}}`;
			
			return value;
		}
		
		function writeSectionHeading(sectionName)
		{
			return tex_SetMisc(`section{`+ sectionName + `}`);
		}
		
		<!-- TEX METHODS -->
		function tex_Begin(type)
		{
			let value = `\\begin{` + type +  `}`;
			return tex_Line(value)
		}

		function tex_End(type)
		{
			let value = `\\end{` + type +  `}`;
			return tex_Line(value)
		}

		function tex_WriteFullLineAtSize(input, size)
		{
			return tex_Line(`\\textbf{\\`+ size + ` \\scshape ` + input +`} \\\\ \\vspace{1pt}`);
		}
		
		function tex_Line(input)
		{
			return input + "\n";
		}
		
		function tex_VerticalBar()
		{
			return " $|$ ";
		}
		
		function tex_SetMisc(misc)
		{
			return `\\` + misc;	
		}
